name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish modpack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG_NAME'. Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${TAG_NAME#v}"

          if [[ ! -f pack.toml ]]; then
            echo "::error::pack.toml was not found."
            exit 1
          fi

          PACK_VERSION="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pack.toml | head -n 1)"

          if [[ -z "$PACK_VERSION" ]]; then
            echo "::error::Could not read version from pack.toml."
            exit 1
          fi

          if [[ "$PACK_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag version ($VERSION) does not match pack.toml version ($PACK_VERSION)."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install Packwiz
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/packwiz" --help

      - name: Prepare isolated build workspaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reys-standard" "$RUNNER_TEMP/reys-nvidia" "$GITHUB_WORKSPACE/dist"

          rsync -a --delete \
            --exclude='.git/' --exclude='dist/' --exclude='incoming/' \
            --exclude='.idea/' --exclude='.vscode/' \
            "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/reys-standard/"

          rsync -a --delete \
            --exclude='.git/' --exclude='dist/' --exclude='incoming/' \
            --exclude='.idea/' --exclude='.vscode/' \
            "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/reys-nvidia/"

          test -f "$RUNNER_TEMP/reys-standard/pack.toml"
          test -f "$RUNNER_TEMP/reys-standard/index.toml"
          test -d "$RUNNER_TEMP/reys-standard/mods"
          test -f "$RUNNER_TEMP/reys-nvidia/extra/nvidia/nvidium.pw.toml"
          test -d "$RUNNER_TEMP/reys-nvidia/mods"

      - name: Build Standard Edition
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/reys-standard"
          OUTPUT="$GITHUB_WORKSPACE/dist/reys-retreat-standard-${VERSION}.mrpack"

          find "$WORKSPACE/mods" -type f -name '*.pw.toml.disabled' -delete

          if find "$WORKSPACE/mods" -type f -name 'nvidium.pw.toml' | grep -q .; then
            echo "::error::Nvidium metadata must not be included in Standard Edition."
            exit 1
          fi

          cd "$WORKSPACE"
          packwiz refresh
          packwiz modrinth export --output "$OUTPUT"
          test -s "$OUTPUT"

      - name: Build NVIDIA Edition
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/reys-nvidia"
          OUTPUT="$GITHUB_WORKSPACE/dist/reys-retreat-nvidia-${VERSION}.mrpack"

          cp "$WORKSPACE/extra/nvidia/nvidium.pw.toml" "$WORKSPACE/mods/nvidium.pw.toml"
          find "$WORKSPACE/mods" -type f -name '*.pw.toml.disabled' -delete

          cd "$WORKSPACE"
          packwiz refresh
          packwiz modrinth export --output "$OUTPUT"
          test -s "$OUTPUT"

      - name: Validate generated archives
        shell: bash
        run: |
          set -euo pipefail
          STANDARD="dist/reys-retreat-standard-${VERSION}.mrpack"
          NVIDIA="dist/reys-retreat-nvidia-${VERSION}.mrpack"
          test -s "$STANDARD"
          test -s "$NVIDIA"
          ls -lh "$STANDARD" "$NVIDIA"

          python3 - "$STANDARD" "$NVIDIA" <<'PY'
          import json
          import sys
          import zipfile

          def inspect_archive(path):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  if "modrinth.index.json" not in names:
                      raise SystemExit(f"ERROR: {path} does not contain modrinth.index.json")
                  with archive.open("modrinth.index.json") as file:
                      index = json.load(file)

              files = index.get("files", [])
              if not isinstance(files, list):
                  raise SystemExit(f"ERROR: Invalid files list in {path}")
              paths = [item.get("path", "") for item in files if isinstance(item, dict)]
              nvidium = [
                  item for item in paths
                  if item.lower().startswith("mods/")
                  and item.rsplit("/", 1)[-1].lower().startswith("nvidium")
                  and item.lower().endswith(".jar")
              ]
              return paths, nvidium

          standard_files, standard_nvidium = inspect_archive(sys.argv[1])
          nvidia_files, nvidia_nvidium = inspect_archive(sys.argv[2])

          if standard_nvidium:
              raise SystemExit("ERROR: Standard Edition unexpectedly contains Nvidium.")
          if not nvidia_nvidium:
              raise SystemExit("ERROR: NVIDIA Edition does not list Nvidium in its index.")

          print(f"Standard files indexed: {len(standard_files)}")
          print(f"NVIDIA files indexed: {len(nvidia_files)}")
          print("Nvidium edition check passed.")
          PY

      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"

          {
            echo "# Rey's Retreat ${VERSION}"
            echo
            echo "> A cozy vanilla+ pack for relaxed survival: build a home, cook, farm, meet wildlife and explore new structures. No extra complexity — just a warmer, prettier Minecraft."
            echo
            echo "## Choose your edition"
            echo
            echo "- **Standard Edition** — the recommended option for most players."
            echo "- **NVIDIA Edition** — includes Nvidium for compatible NVIDIA graphics hardware. If you encounter rendering issues or are unsure whether your GPU is supported, use Standard."
            echo
            echo "## Installation"
            echo
            echo "1. Download one of the `.mrpack` files below."
            echo "2. Import the file into the Modrinth App (or another launcher that supports Modrinth modpacks)."
            echo "3. Launch the created profile. The pack targets Minecraft 1.21.1 with Fabric."
            echo
            echo "## Changes"
            echo
          } > body.md

          if [[ -n "$PREV_TAG" ]]; then
            echo "Changes compared with **$PREV_TAG**:" >> body.md
            echo >> body.md

            python3 - "$PREV_TAG" "$TAG_NAME" >> body.md <<'PY'
          import subprocess
          import sys

          previous, current = sys.argv[1:3]

          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE
              ).stdout

          def section(title, items):
              if not items:
                  return
              print(f"### {title}\n")
              for item in items:
                  print(f"- {item}")
              print()

          changes = []
          for line in git("diff", "--name-status", "--find-renames", previous, current).splitlines():
              parts = line.split("\t")
              status = parts[0]
              path = parts[-1]
              old_path = parts[1] if status.startswith("R") and len(parts) > 2 else None
              changes.append((status, path, old_path))

          added_mods, removed_mods, updated_mods = [], [], []
          config_changes, pack_changes, docs_changes, other_changes = [], [], [], []

          for status, path, old_path in changes:
              if path.startswith("mods/") and path.endswith(".pw.toml"):
                  name = path.removeprefix("mods/").removesuffix(".pw.toml")
                  if status == "A":
                      added_mods.append(name)
                  elif status == "D":
                      removed_mods.append(name)
                  else:
                      updated_mods.append(name)
              elif path.startswith("config/") or path == "options.txt":
                  label = f"{status} {path}"
                  config_changes.append(label)
              elif path in {"pack.toml", "index.toml"}:
                  pack_changes.append(f"{status} {path}")
              elif path in {"README.md", "CHANGELOG.md"} or path.startswith("docs/"):
                  docs_changes.append(f"{status} {path}")
              elif path.startswith(".github/") or path.endswith((".bat", ".go", ".mod", ".sum")):
                  other_changes.append(f"{status} {path}")

          def mod_items(values):
              return sorted(set(values), key=str.casefold)

          section("Mods added", mod_items(added_mods))
          section("Mods removed", mod_items(removed_mods))
          section("Mod metadata updated", mod_items(updated_mods))
          section("Configuration and options", sorted(config_changes))
          section("Pack definition and index", sorted(pack_changes))
          section("Documentation", sorted(docs_changes))
          section("Build tooling and workflows", sorted(other_changes))

          commits = git(
              "log", "--no-merges", "--pretty=format:%s (%h)", f"{previous}..{current}"
          ).splitlines()
          section("Commits", commits)

          if not changes and not commits:
              print("No file changes or non-merge commits were detected.")
          PY
          else
            echo "This is the first tagged release generated by this workflow." >> body.md
            echo >> body.md
            echo "See the repository history for implementation details. Future releases will list changes relative to the previous version tag." >> body.md
          fi

          {
            echo "## Downloads"
            echo
            echo "- `reys-retreat-standard-${VERSION}.mrpack` — Standard Edition."
            echo "- `reys-retreat-nvidia-${VERSION}.mrpack` — NVIDIA Edition with Nvidium."
            echo
            echo "Both files are Modrinth-format modpack archives; they do not contain a standalone copy of every mod JAR."
          } >> body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rey's Retreat ${{ env.VERSION }}
          body_path: body.md
          files: |
            dist/reys-retreat-standard-${{ env.VERSION }}.mrpack
            dist/reys-retreat-nvidia-${{ env.VERSION }}.mrpack
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
